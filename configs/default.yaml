# Default configuration — overridden by model and dataset configs, then CLI args
model:
  name: yolov8n              # yolov8n | yolov8s | yolov8s_p2
  input_size: 640            # 640 (safe) | 960 (better for small objects, needs small batch)
  pretrained: true           # Use COCO pretrained weights

data:
  dataset: visdrone          # visdrone | uavdt
  train_split: train
  val_split: val
  test_split: test
  # VisDrone classes
  names:
    0: pedestrian
    1: people
    2: bicycle
    3: car
    4: van
    5: truck
    6: tricycle
    7: awning-tricycle
    8: bus
    9: motor
  nc: 10

training:
  epochs: 100
  batch_size: 16             # Auto-reduced if OOM on 8GB GPU
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01                  # Final LR = lr0 * lrf
  momentum: 0.937
  weight_decay: 0.0005
  patience: 20                # Early stopping patience
  augment: true
  mixup: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
  workers: 4                   # Dataloader workers (reduce to 2 if CPU RAM OOM)
  p2_head: false              # Enable P2 small-object detection head

export:
  format: onnx                # onnx | engine
  opset: 11
  simplify: true
  half: true                  # FP16 for TensorRT
  int8: false                 # INT8 calibration (Jetson only)
  workspace: 4                # GB of GPU workspace for TensorRT
  int8_calib_data: null        # Path to calibration dataset for INT8

inference:
  conf: 0.25                  # Confidence threshold
  iou: 0.45                   # NMS IoU threshold
  device: 0                   # GPU id, or "cpu"
  max_det: 300                # Max detections per image

sahi:
  enabled: false              # Enable Slicing Aided Hyper Inference
  slice_size: 640             # Tile size in pixels
  slice_overlap: 0.25         # Overlap ratio between adjacent tiles (0–0.5)
  merge_iou: 0.45             # IoU threshold for merging detections across tiles

tracking:
  backend: bytetrack          # bytetrack | botsort
  track_thresh: 0.25
  track_buffer: 30             # Frame buffer for track persistence
  match_thresh: 0.8           # Matching threshold for track association
  frame_rate: 30

benchmark:
  warmup: 10                  # Frames to skip before measuring
  iterations: 300             # Number of frames to benchmark
  measure_memory: true
  measure_power: false         # True only on Jetson (uses tegrastats)
  power_mode: maxn_super        # maxn_super | 25w | 15w | 7w (Jetson Orin Nano Super)
  # Suite settings (used by run_benchmark_suite.py)
  conf_map: 0.001             # Confidence threshold for mAP evaluation
  conf_deploy: 0.25            # Confidence threshold for deployment FPS
  iou_map: 0.65               # IoU threshold for mAP computation
  iou_deploy: 0.45            # IoU threshold for deployment NMS
  max_images: 0                # Max val images for mAP (0 = all 548)
  sahi_configs:                # SAHI sweep configurations
    - slice_size: 640
      slice_overlap: 0.25
    - slice_size: 480
      slice_overlap: 0.25
    - slice_size: 640
      slice_overlap: 0.20

paths:
  data_dir: data
  output_dir: outputs
  visdrone_url: "https://github.com/VisDrone/VisDrone-Dataset"